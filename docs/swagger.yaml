basePath: /api/v1
definitions:
  github_com_MeshCore-Beacon_beacon-server_internal_api.Channel:
    properties:
      channelHash:
        description: hex-encoded single-byte hash
        type: string
      hashtag:
        description: 'tag name without # prefix; non-nil only for hashtag channels'
        type: string
      id:
        type: integer
      isHashtag:
        description: true if key was derived from a hashtag PSK
        type: boolean
      keyFingerprint:
        description: first 8 bytes of SHA256(key), hex-encoded
        type: string
      keyKnown:
        description: true if Beacon has a decryption key for this channel
        type: boolean
      lastSeen:
        description: epoch ms, time of most recent message
        type: integer
      messageCount:
        type: integer
      name:
        description: display name from config or nil
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelMessage:
    properties:
      channelHash:
        description: hex-encoded single-byte channel hash
        type: string
      content:
        description: decrypted message text
        type: string
      id:
        type: integer
      observationCount:
        description: number of packet_observations rows for this message's packet
          hash
        type: integer
      packetHash:
        description: hex-encoded packet hash for correlation with packet events
        type: string
      senderName:
        description: display name from the decrypted payload
        type: string
      sentAt:
        description: epoch ms, from the sender's embedded timestamp
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummary:
    properties:
      channelHash:
        description: hex-encoded single-byte hash
        type: string
      id:
        type: integer
      isHashtag:
        description: true if key was derived from a hashtag PSK
        type: boolean
      keyKnown:
        description: true if Beacon has a decryption key for this channel
        type: boolean
      lastSeen:
        description: epoch ms, time of most recent message
        type: integer
      name:
        description: display name from config or nil
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ClockDriftEntry:
    properties:
      clockCheckedAt:
        description: epoch ms
        type: integer
      clockDriftSeconds:
        description: signed; +ve = device ahead of server
        type: integer
      iatas:
        description: IATAs this node has been heard in
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.NodeIATA'
        type: array
      nodeId:
        type: string
      nodeName:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATAHop:
    properties:
      fromIata:
        type: string
      fromNode:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: last node in source IATA
      lastSeen:
        description: epoch ms
        type: integer
      toIata:
        type: string
      toNode:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: first node in target IATA
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATARoute:
    properties:
      crossHop:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATAHop'
        description: the boundary hop
      sourceSegment:
        description: route segment in source IATA
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      targetSegment:
        description: route segment in target IATA
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      totalHops:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.IATA:
    properties:
      displayName:
        type: string
      iata:
        type: string
      lat:
        type: number
      lon:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.KnownRoute:
    properties:
      firstSeen:
        description: epoch ms
        type: integer
      hopCount:
        type: integer
      hops:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      iata:
        type: string
      id:
        type: integer
      lastSeen:
        description: epoch ms
        type: integer
      observationCount:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.NodeIATA:
    properties:
      iata:
        type: string
      lastHeard:
        description: epoch ms
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.NodeTypeCount:
    properties:
      count:
        type: integer
      nodeType:
        type: integer
      nodeTypeName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ObservationPoint:
    properties:
      activeObservers:
        type: integer
      hour:
        description: epoch ms, start of the 1-hour bucket
        type: integer
      iata:
        type: string
      observationCount:
        type: integer
      uniquePackets:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ObserverTelemetry:
    properties:
      interval:
        type: string
      points:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ObserverTelemetryPoint'
        type: array
      range:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ObserverTelemetryPoint:
    properties:
      airtimeRxPct:
        type: number
      airtimeTxPct:
        type: number
      batteryMv:
        type: integer
      noiseFloorDb:
        type: number
      queueLength:
        type: integer
      receiveErrors:
        type: integer
      t:
        description: epoch ms
        type: integer
      uptimeSeconds:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PacketHeader:
    properties:
      payloadType:
        description: bits 2-5
        type: integer
      payloadTypeName:
        description: advert, request, group_text, etc.
        type: string
      payloadVersion:
        description: bits 6-7
        type: integer
      raw:
        description: hex-encoded single byte
        type: string
      routeType:
        description: bits 0-1
        type: integer
      routeTypeName:
        description: FLOOD, DIRECT, TRANSPORT_FLOOD, TRANSPORT_DIRECT
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PacketPathLength:
    properties:
      hashSize:
        description: per-hop hash size in bytes (1, 2, or 3)
        type: integer
      hopCount:
        description: number of path hashes present
        type: integer
      raw:
        description: hex-encoded single byte
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PacketTransportCodes:
    properties:
      regionCode:
        type: integer
      subRegionCode:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.Page-github_com_MeshCore-Beacon_beacon-server_internal_api_ChannelSummary:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummary'
        type: array
      nextCursor:
        type: integer
    type: object
  ? github_com_MeshCore-Beacon_beacon-server_internal_api.Page-github_com_MeshCore-Beacon_beacon-server_internal_api_PublicAdvertObservation
  : properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicAdvertObservation'
        type: array
      nextCursor:
        type: integer
    type: object
  ? github_com_MeshCore-Beacon_beacon-server_internal_api.Page-github_com_MeshCore-Beacon_beacon-server_internal_api_PublicNodeSummary
  : properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeSummary'
        type: array
      nextCursor:
        type: integer
    type: object
  ? github_com_MeshCore-Beacon_beacon-server_internal_api.Page-github_com_MeshCore-Beacon_beacon-server_internal_api_PublicObserverSummary
  : properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicObserverSummary'
        type: array
      nextCursor:
        type: integer
    type: object
  ? github_com_MeshCore-Beacon_beacon-server_internal_api.Page-github_com_MeshCore-Beacon_beacon-server_internal_api_PublicPacketObservationSummary
  : properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacketObservationSummary'
        type: array
      nextCursor:
        type: integer
    type: object
  ? github_com_MeshCore-Beacon_beacon-server_internal_api.Page-github_com_MeshCore-Beacon_beacon-server_internal_api_PublicPacketSummary
  : properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacketSummary'
        type: array
      nextCursor:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PayloadBreakdownItem:
    properties:
      count:
        type: integer
      payloadType:
        type: integer
      payloadTypeName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicAdvertObservation:
    properties:
      heardAt:
        type: integer
      hopCount:
        type: integer
      iata:
        type: string
      id:
        type: integer
      nodeName:
        type: string
      nodePublicKey:
        type: string
      packetHash:
        type: string
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      rssi:
        type: integer
      snr:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNode:
    properties:
      clockCheckedAt:
        type: integer
      clockDriftSeconds:
        type: integer
      clockOutOfSync:
        type: boolean
      defaultScope:
        type: string
      firstSeen:
        type: integer
      iatas:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeIATA'
        type: array
      id:
        type: string
      isObserver:
        type: boolean
      knownNeighborCount:
        type: integer
      lastAdvertAt:
        type: integer
      lastSeen:
        type: integer
      lat:
        type: number
      lng:
        type: number
      locationSource:
        type: string
      minFirmwareVersion:
        type: string
      name:
        type: string
      neighborIds:
        items:
          type: string
        type: array
      neighbors:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeNeighbor'
        type: array
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      observerId:
        type: string
      publicKey:
        type: string
      radio:
        type: string
      stale:
        type: boolean
      supportsMultibytePaths:
        type: boolean
      supportsMultibyteTraces:
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeIATA:
    properties:
      iata:
        type: string
      lastHeard:
        description: epoch ms
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeNeighbor:
    properties:
      firstSeen:
        description: epoch ms
        type: integer
      iata:
        type: string
      id:
        type: string
      lastSeen:
        description: epoch ms
        type: integer
      lat:
        type: number
      lng:
        type: number
      name:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      observationCount:
        type: integer
      publicKey:
        type: string
      snr:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeSummary:
    properties:
      defaultScope:
        type: string
      iatas:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicNodeIATA'
        type: array
      id:
        type: string
      isObserver:
        type: boolean
      knownNeighborCount:
        type: integer
      lat:
        type: number
      lng:
        type: number
      name:
        type: string
      neighborIds:
        items:
          type: string
        type: array
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      observerId:
        type: string
      publicKey:
        type: string
      radio:
        type: string
      stale:
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicObserver:
    properties:
      batteryLevel:
        type: number
      brokers:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicObserverBroker'
        type: array
      displayName:
        type: string
      firmwareBuild:
        type: string
      firmwareVersion:
        type: string
      firstSeen:
        type: integer
      hardwareModel:
        type: string
      iata:
        type: string
      id:
        type: string
      lastSeen:
        type: integer
      lastStatusAt:
        type: integer
      observationCount:
        type: integer
      observerType:
        type: string
      publicKey:
        type: string
      radio:
        type: string
      radioBwKhz:
        type: number
      radioCr:
        type: integer
      radioFreqMhz:
        type: number
      radioSf:
        type: integer
      scopes:
        items:
          type: string
        type: array
      softwareVersion:
        type: string
      status:
        type: string
      uptimeSeconds:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicObserverBroker:
    properties:
      lastPacketAt:
        description: epoch ms, 0 if none
        type: integer
      lastSeenAt:
        description: epoch ms
        type: integer
      name:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicObserverSummary:
    properties:
      displayName:
        type: string
      iata:
        type: string
      id:
        type: string
      observerType:
        type: string
      radio:
        type: string
      scopes:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacket:
    properties:
      channelHash:
        type: string
      decrypted:
        type: boolean
      firstHeardAt:
        type: integer
      firstToLastMs:
        type: integer
      header:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PacketHeader'
      lastHeardAt:
        type: integer
      observationCount:
        type: integer
      originPubkey:
        type: string
      packetHash:
        type: string
      resolvedRoute:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        type: array
      scope:
        type: string
      transportCodes:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PacketTransportCodes'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacketLatestObserver:
    properties:
      displayName:
        type: string
      iata:
        type: string
      id:
        type: string
      pathBytes:
        type: string
      pathLength:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PacketPathLength'
      resolvedDestination:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
      resolvedPath:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        type: array
      resolvedSource:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacketObservationSummary:
    properties:
      heardAt:
        type: integer
      hopCount:
        type: integer
      iata:
        type: string
      id:
        type: integer
      packetHash:
        type: string
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      rssi:
        type: integer
      snr:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacketSummary:
    properties:
      firstHeardAt:
        type: integer
      lastHeardAt:
        type: integer
      latestObserver:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PublicPacketLatestObserver'
      observationCount:
        type: integer
      packetHash:
        type: string
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      routeType:
        type: integer
      routeTypeName:
        type: string
      scope:
        type: string
      summary:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.RadioPreset:
    properties:
      count:
        description: number of observers or nodes on this preset in this IATA
        type: integer
      iata:
        type: string
      preset:
        description: '"freqMhz,bwKhz,sf" e.g. "910.525,62.5,7"'
        type: string
      sourceType:
        description: '"observer" or "node"'
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.RawHop:
    properties:
      hash:
        description: hex-encoded path hash
        type: string
      snr:
        description: signal-to-noise ratio in dB, if available
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.Region:
    properties:
      centerLat:
        description: map center latitude
        type: number
      centerLng:
        description: map center longitude
        type: number
      description:
        type: string
      iatas:
        description: member IATA codes
        items:
          type: string
        type: array
      id:
        type: integer
      name:
        type: string
      slug:
        description: URL-safe identifier e.g. "western-canada"
        type: string
      zoomLevel:
        description: suggested map zoom level
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.RegionSummary:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        description: URL-safe identifier e.g. "western-canada"
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop:
    properties:
      confidence:
        description: '"high", "ambiguous", or "none"'
        type: string
      nodes:
        description: empty for "none", one for "high", multiple for "ambiguous"
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        type: array
      snr:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode:
    properties:
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      publicKey:
        description: hex-encoded prefix used for resolution
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop:
    properties:
      hashBytes:
        description: hex-encoded hash prefix
        type: string
      node:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: populated when node details are available
      nodeId:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ScopeDetail:
    properties:
      iataCount:
        type: integer
      iatas:
        items:
          type: string
        type: array
      name:
        type: string
      nodeCount:
        type: integer
      observerCount:
        type: integer
      packetCount:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ScopeStats:
    properties:
      name:
        description: normalized scope name e.g. "#bc"
        type: string
      nodeCount:
        description: distinct nodes with this as their default scope
        type: integer
      observerCount:
        description: distinct observers that forwarded packets in this scope
        type: integer
      packetCount:
        description: distinct packets matched to this scope
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.StatsOverview:
    properties:
      activeIatas:
        type: integer
      activeObservers:
        type: integer
      totalObservations:
        type: integer
      totalPackets:
        type: integer
      windowHours:
        description: always 24 for now
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopAdvertiser:
    properties:
      advertCount:
        type: integer
      directAdvertCount:
        type: integer
      floodAdvertCount:
        description: |-
          FloodAdvertCount/DirectAdvertCount split AdvertCount by how the advert was routed:
          flood = route type 0 (transport_flood) or 1 (flood), broadcast with no known path;
          direct = route type 2 (direct) or 3 (transport_direct), routed along a known path.
          FloodAdvertCount + DirectAdvertCount == AdvertCount.
        type: integer
      iata:
        type: string
      lastHeard:
        description: epoch ms
        type: integer
      nodeId:
        type: string
      nodeName:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopNode:
    properties:
      iata:
        type: string
      lastHeard:
        description: epoch ms
        type: integer
      nodeId:
        type: string
      nodeName:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      observationCount:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopObserver:
    properties:
      displayName:
        type: string
      iata:
        type: string
      observationCount:
        type: integer
      observerId:
        type: string
      observerType:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopTalker:
    properties:
      lastSent:
        description: epoch ms
        type: integer
      messageCount:
        type: integer
      senderName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TraceDetail:
    properties:
      packets:
        description: all packets observed for this trace
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TracePacket'
        type: array
      traceTag:
        description: hex-encoded 4-byte tag
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TracePacket:
    properties:
      firstHeardAt:
        description: epoch ms
        type: integer
      lastHeardAt:
        description: epoch ms
        type: integer
      packetHash:
        description: hex-encoded packet hash
        type: string
      rawPath:
        description: hops as received in the packet
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RawHop'
        type: array
      resolvedRoute:
        description: hops resolved to known nodes
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        type: array
      routeType:
        description: numeric route type
        type: integer
      routeTypeName:
        description: human-readable route type
        type: string
      scope:
        description: transport scope name, if known
        type: string
    type: object
